<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Piggy Escape: Farmer Chase</title>
  <link rel="stylesheet" href="style.css">
  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <!-- Touch Controls Overlay for Mobile -->
  <div id="touch-controls" class="touch-controls hidden">
    <div class="dpad">
      <button class="dpad-btn up" id="btn-up" aria-label="Up">▲</button>
      <div class="dpad-middle">
        <button class="dpad-btn left" id="btn-left" aria-label="Left">◀</button>
        <button class="dpad-btn right" id="btn-right" aria-label="Right">▶</button>
      </div>
      <button class="dpad-btn down" id="btn-down" aria-label="Down">▼</button>
    </div>
    <div class="action-buttons">
      <button class="action-btn jump-btn" id="btn-jump">JUMP</button>
      <button class="action-btn dash-btn" id="btn-dash">DASH</button>
    </div>
  </div>

  <!-- Game Scripts -->
  <script src="src/audio.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/LevelPreviewScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/UIScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
